<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Тест captions — Google Meet</title>
    <link rel="stylesheet" href="content.css?v=091">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        color: #eef1f6;
        background: #202124;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .harness-content {
        max-width: 760px;
        margin: 80px auto;
        padding: 0 24px;
      }
      .meet-layout-model {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        opacity: 0;
      }
      .meet-layout-model main {
        position: absolute;
        top: 72px;
        left: 16px;
        right: 16px;
        height: 424px;
      }
      .meet-layout-model .meet-tile-a {
        position: absolute;
        top: 0;
        left: 362px;
        width: 755px;
        height: 424px;
      }
      .meet-layout-model .meet-tile-b {
        position: absolute;
        inset: 0;
      }
      .meet-layout-model video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .meet-layout-model .meet-pip {
        position: absolute;
        right: 15px;
        bottom: 15px;
        width: 237px;
        height: 134px;
      }
      .equal-video-layout .meet-layout-model .meet-pip {
        top: 0;
        right: auto;
        bottom: auto;
        left: 616px;
        width: 600px;
        height: 424px;
      }
      .equal-video-layout .meet-layout-model .meet-tile-a {
        left: 0;
        width: 600px;
      }
      .meet-layout-model [jsname="EaZ7Cc"] {
        position: absolute;
        top: calc(100vh - 80px);
        left: 0;
        right: 0;
        height: 80px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 24px 0;
      }
      .controls button {
        color: #202124;
        background: #8ab4f8;
        border: 0;
        border-radius: 20px;
        padding: 10px 16px;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
      }
      .vNKgIf {
        min-height: 120px;
        padding: 20px;
        background: #111318;
        border-radius: 16px;
      }
      .nMcdL {
        margin: 12px 0;
      }
      .NWpY1d {
        color: #8ab4f8;
        font-size: 13px;
        font-weight: 700;
      }
      .ygicle {
        margin-top: 3px;
      }
      .caption-layout-reserved {
        min-height: 260px;
        background: #111318;
      }
      .caption-layout-shell {
        min-height: 220px;
        position: relative;
      }
      .caption-layout-zero {
        width: 0;
        height: 0;
      }
      #caption-host {
        min-height: 180px;
      }
    </style>
  </head>
  <body>
    <div class="meet-layout-model" aria-hidden="true">
      <main class="axUSnc cZXVke P9KVBf">
        <div class="meet-tile-a">
          <div class="meet-tile-b"><video muted></video></div>
        </div>
        <div class="meet-pip"><video muted></video></div>
      </main>
      <div jsname="EaZ7Cc" class="UnvNgf"></div>
    </div>
    <div class="harness-content">
      <h1>Локальна перевірка Meet captions</h1>
      <p>
        Кнопки нижче імітують те, як Google Meet поступово дописує репліку,
        змінює спікера та перебудовує DOM.
      </p>
      <div class="controls">
        <button id="meet-caption-toggle" aria-label="Turn on captions (c)">
          CC вимкнено
        </button>
        <button id="start">Почати репліку</button>
        <button id="extend">Доповнити репліку</button>
        <button id="speaker">Інший спікер</button>
        <button id="recreate">Перебудувати DOM</button>
        <button id="chat">Додати повідомлення чату</button>
        <button id="leave" aria-label="Leave call">Вийти із зустрічі</button>
      </div>
      <div class="caption-layout-reserved">
        <div class="caption-layout-shell">
          <div class="caption-layout-zero">
            <div id="caption-host" jsname="tgaKEf"></div>
          </div>
          <button class="caption-overlay-control" type="button">
            Caption overlay control
          </button>
        </div>
      </div>
      <div id="chat-host" role="log" aria-label="In-call messages"></div>
      <div data-participant-id="participant-oleh">
        <span data-meeting-transcriber-participant-name="Інтерв’юер"></span>
      </div>
      <div data-participant-id="participant-anna">
        <img alt="Анна">
      </div>
    </div>
    <script src="test-harness.js?v=092"></script>
    <script src="caption-model.js?v=094"></script>
    <script src="caption-toggle.js?v=092"></script>
    <script src="auto-export.js?v=082"></script>
    <script src="rtc-fallback.js?v=093"></script>
    <script src="rtc-caption-codec.js?v=082"></script>
    <script src="content.js?v=094"></script>
  </body>
</html>
